services:
  - type: web
    name: el-memorialista-juridico
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt -c constraints.txt
    startCommand: uvicorn app.main:app --no-proxy-headers --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: KEEP_ALIVE
        value: "False"
      - key: APP_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: archivos-privados
      - key: AUTH_ALLOW_SIGNUP
        value: "False"
      - key: AUTH_COOKIE_MAX_AGE_SECONDS
        value: "3600"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_PRO
        value: gemini-4-argon
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.5-flash-lite,gemini-2.5-flash
      - key: LIMITE_DIA_USUARIO
        value: "50"
    # Opcionales, añadir como secretos en Environment si se van a utilizar:
    # SUPABASE_SERVICE_ROLE_KEY (eliminación de cuentas), GROQ_API_KEY (respaldo IA).
    # La IP del cliente usa el peer real por defecto. Configurar explícitamente
    # PROXY_IPS_CONFIABLES y PROXIES_CONFIABLES o IP_CABECERA_CONFIABLE solo si
    # se conoce la cadena de proxies del alojamiento. No confiar en cualquier IP.
